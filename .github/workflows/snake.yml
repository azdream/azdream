name: Generate Contribution Snake

on:
  schedule:
    # Run every day at 00:00 UTC (09:00 KST)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff6b9d&color_dots=#ebedf0,#ffd6e7,#ffb3d1,#9f7aea,#22d3ee
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff7eb6&color_dots=#161b22,#3b2f63,#6d4aff,#9d7cff,#5eead4

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
