<svg xmlns="http://www.w3.org/2000/svg" width="840" height="24" viewBox="0 0 840 24" shape-rendering="crispEdges">
  <style>
    @keyframes twinkleA { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes twinkleB { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .ta { animation: twinkleA 1.6s steps(2, end) infinite; }
    .tb { animation: twinkleB 1.6s steps(2, end) infinite; }
  </style>
  <rect width="840" height="24" fill="#0d1117"/>
  <!-- Left pixel track -->
  <rect x="8" y="11" width="332" height="2" fill="#233046"/>
  <rect x="8" y="9" width="6" height="6" fill="#30425e"/>
  <rect x="18" y="10" width="4" height="4" fill="#3b5275"/>
  <!-- Right pixel track -->
  <rect x="500" y="11" width="332" height="2" fill="#233046"/>
  <rect x="826" y="9" width="6" height="6" fill="#30425e"/>
  <rect x="818" y="10" width="4" height="4" fill="#3b5275"/>

  <!-- 5 agent color pixel gems -->
  <g class="ta">
    <rect x="356" y="8" width="8" height="8" fill="#fa9679"/>
    <rect x="358" y="10" width="4" height="4" fill="#ffe4dc"/>
  </g>
  <g class="tb">
    <rect x="386" y="8" width="8" height="8" fill="#60a5fa"/>
    <rect x="388" y="10" width="4" height="4" fill="#dbeafe"/>
  </g>
  <g class="ta">
    <rect x="416" y="6" width="12" height="12" fill="#34d399"/>
    <rect x="418" y="8" width="8" height="8" fill="#a7f3d0"/>
    <rect x="420" y="10" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="tb">
    <rect x="448" y="8" width="8" height="8" fill="#a78bfa"/>
    <rect x="450" y="10" width="4" height="4" fill="#ede9fe"/>
  </g>
  <g class="ta">
    <rect x="478" y="8" width="8" height="8" fill="#fbbf24"/>
    <rect x="480" y="10" width="4" height="4" fill="#fef3c7"/>
  </g>
</svg>
