      <rect x="96" y="44" width="74" height="24" fill="#1a2234"/><rect x="96" y="66" width="74" height="2" fill="#60a5fa"/>
      <text x="133" y="60" text-anchor="middle" fill="#f8fafc">Gemini</text>

      <rect x="178" y="44" width="74" height="24" fill="#1a2234"/><rect x="178" y="66" width="74" height="2" fill="#34d399"/>
      <text x="215" y="60" text-anchor="middle" fill="#f8fafc">Codex</text>

      <rect x="14" y="78" width="66" height="24" fill="#1a2234"/><rect x="14" y="100" width="66" height="2" fill="#a78bfa"/>
      <text x="47" y="94" text-anchor="middle" fill="#f8fafc">Kiro</text>

      <rect x="88" y="78" width="82" height="24" fill="#1a2234"/><rect x="88" y="100" width="82" height="2" fill="#fbbf24"/>
      <text x="129" y="94" text-anchor="middle" fill="#f8fafc">Genspark</text>

      <rect x="178" y="78" width="74" height="24" fill="#1a2234"/><rect x="178" y="100" width="74" height="2" fill="#5eead4"/>
      <text x="215" y="94" text-anchor="middle" fill="#f8fafc">MCP</text>

      <rect x="14" y="112" width="114" height="24" fill="#1a2234"/><rect x="14" y="134" width="114" height="2" fill="#a78bfa"/>
      <text x="71" y="128" text-anchor="middle" fill="#f8fafc">Ontology</text>

      <rect x="136" y="112" width="116" height="24" fill="#1a2234"/><rect x="136" y="134" width="116" height="2" fill="#60a5fa"/>
      <text x="194" y="128" text-anchor="middle" fill="#f8fafc">Governance</text>
    </g>
    <text x="14" y="154" class="mono" font-size="10" fill="#94a3b8">PLANNER · WORKER · JUDGE</text>
