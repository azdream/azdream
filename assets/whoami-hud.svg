<svg xmlns="http://www.w3.org/2000/svg" width="840" height="236" viewBox="0 0 840 236" shape-rendering="crispEdges">
  <style>
    .mono { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .led { animation: glow 1.8s steps(2, end) infinite; }
