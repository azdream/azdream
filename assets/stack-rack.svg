  <g transform="translate(568, 2)">
    <rect x="4" y="4" width="266" height="164" fill="#06090f"/>
    <rect x="0" y="0" width="266" height="164" fill="#101724"/>
    <rect x="0" y="0" width="266" height="2" fill="#34d399"/>
    <rect x="0" y="162" width="266" height="2" fill="#34d399"/>
    <rect x="0" y="0" width="2" height="164" fill="#34d399"/>
    <rect x="264" y="0" width="2" height="164" fill="#34d399"/>
    <rect x="2" y="2" width="262" height="28" fill="#142422"/>
    <rect x="2" y="30" width="262" height="2" fill="#16523e"/>
    <rect class="led3" x="12" y="12" width="8" height="8" fill="#34d399"/>
