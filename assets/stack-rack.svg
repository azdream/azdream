      <rect x="134" y="78" width="118" height="24" fill="#1a2234"/><rect x="134" y="100" width="118" height="2" fill="#facc15"/>
      <text x="193" y="94" text-anchor="middle" fill="#f8fafc">tmux Runtime</text>

      <rect x="14" y="112" width="112" height="24" fill="#1a2234"/><rect x="14" y="134" width="112" height="2" fill="#5eead4"/>
      <text x="70" y="128" text-anchor="middle" fill="#f8fafc">OCR · Retail</text>

      <rect x="134" y="112" width="118" height="24" fill="#1a2234"/><rect x="134" y="134" width="118" height="2" fill="#5eead4"/>
      <text x="193" y="128" text-anchor="middle" fill="#f8fafc">GitHub Pages</text>
    </g>
    <text x="14" y="154" class="mono" font-size="10" fill="#94a3b8">OBSERVABLE · HUMAN-IN-LOOP</text>
