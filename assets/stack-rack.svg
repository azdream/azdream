    <rect x="0" y="0" width="266" height="2" fill="#60a5fa"/>
    <rect x="0" y="162" width="266" height="2" fill="#60a5fa"/>
    <rect x="0" y="0" width="2" height="164" fill="#60a5fa"/>
    <rect x="264" y="0" width="2" height="164" fill="#60a5fa"/>
    <rect x="2" y="2" width="262" height="28" fill="#162033"/>
